min_particles: 500
max_particles: 2000
kld_err: 0.05
update_min_d: 0.2
update_min_a: 0.2

# Mecanum base: omni odometry model is a better fit than differential.
odom_model_type: omni
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2

laser_model_type: likelihood_field
laser_z_hit: 0.9
laser_z_rand: 0.05
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_z_short: 0.05

tf_broadcast: true
resample_interval: 1

