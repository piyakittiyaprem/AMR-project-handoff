controller_frequency: 10.0

TrajectoryPlannerROS:
  acc_lim_x: 0.5
  acc_lim_y: 0.5
  acc_lim_theta: 0.8

  max_vel_x: 0.3
  min_vel_x: -0.3

  max_vel_y: 0.3
  min_vel_y: -0.3

  max_vel_theta: 0.6
  min_vel_theta: -0.6

  holonomic_robot: true

  yaw_goal_tolerance: 0.1
  xy_goal_tolerance: 0.1

  sim_time: 2.0
  sim_granularity: 0.02
  vx_samples: 10
  vy_samples: 10
  vtheta_samples: 20

  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.02

