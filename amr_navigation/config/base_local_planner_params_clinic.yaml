# Tighter, slower, more forgiving in narrow clinic doorways.
controller_frequency: 10.0

TrajectoryPlannerROS:
  acc_lim_x: 0.35
  acc_lim_y: 0.35
  acc_lim_theta: 0.65
  max_vel_x: 0.22
  min_vel_x: -0.22
  max_vel_y: 0.22
  min_vel_y: -0.22
  max_vel_theta: 0.5
  min_vel_theta: -0.5
  holonomic_robot: true
  yaw_goal_tolerance: 0.2
  xy_goal_tolerance: 0.28
  sim_time: 2.5
  sim_granularity: 0.025
  vx_samples: 8
  vy_samples: 8
  vtheta_samples: 16
  path_distance_bias: 28.0
  goal_distance_bias: 28.0
  occdist_scale: 0.012
